<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-labelledby="title desc">
  <title id="title">Cancha sintetica indoor</title>
  <desc id="desc">Cancha sintetica de futbol con porterias, lineas blancas y malla protectora.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ece7d8"/>
      <stop offset="1" stop-color="#d8d2bd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f6b36"/>
      <stop offset="0.5" stop-color="#42a84d"/>
      <stop offset="1" stop-color="#23723c"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d4b31"/>
      <stop offset="1" stop-color="#12633d"/>
    </linearGradient>
    <pattern id="net" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#263326" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <pattern id="turf" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 18 18 2M-6 14 14-6M8 24 24 8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1733" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="506" fill="#eaf6ff"/>
  <g filter="url(#shadow)">
    <path d="M80 42h740l48 410H32z" fill="url(#wall)"/>
    <path d="M108 86h684l48 330H60z" fill="url(#grass)"/>
    <path d="M108 86 60 416h58l38-330z" fill="url(#side)" opacity="0.95"/>
    <path d="M792 86 840 416h-58l-38-330z" fill="url(#side)" opacity="0.95"/>
    <path d="M108 86h684l48 330H60z" fill="url(#turf)" opacity="0.85"/>

    <path d="M160 108 118 392M740 108l42 284M160 108h580M118 392h664" fill="none" stroke="#f4f6ef" stroke-width="7" stroke-linecap="round"/>
    <path d="M450 110v282" stroke="#f4f6ef" stroke-opacity="0.72" stroke-width="4"/>
    <ellipse cx="450" cy="250" rx="88" ry="36" fill="none" stroke="#f4f6ef" stroke-width="6"/>
    <path d="M292 392c18-64 76-102 158-102s140 38 158 102" fill="none" stroke="#f4f6ef" stroke-width="6"/>
    <path d="M338 108c8 42 50 66 112 66s104-24 112-66" fill="none" stroke="#f4f6ef" stroke-width="5"/>

    <g>
      <path d="M352 84h196v54H352z" fill="none" stroke="#f4f6ef" stroke-width="8"/>
      <path d="M360 92h180v46H360z" fill="url(#net)" opacity="0.65"/>
    </g>

    <g>
      <path d="M300 330h300v116H300z" fill="none" stroke="#f4f6ef" stroke-width="10" stroke-linejoin="round"/>
      <path d="M312 340h276v96H312z" fill="url(#net)" opacity="0.7"/>
      <path d="M300 446h300" stroke="#d5d9cc" stroke-width="8"/>
    </g>

    <circle cx="450" cy="286" r="9" fill="#f4f6ef" stroke="#cfd4c8" stroke-width="2"/>
    <rect x="40" y="42" width="820" height="410" fill="url(#net)" opacity="0.45"/>
  </g>
