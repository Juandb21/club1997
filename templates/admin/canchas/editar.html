{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Club 1997 - Editar Cancha</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/cliente_dashboard.css' %}">
</head>
<body>
  <header class="dashboard-header">
    <div class="container header-content">
      <div class="logo-section">
        <div class="logo-circle">C97</div>
        <div class="logo-text">
          <h1>Club 1997</h1>
          <p>Editar Cancha</p>
        </div>
      </div>
      <nav class="nav">
        <a href="{% url 'logout' %}" class="btn-logout">Cerrar Sesión</a>
      </nav>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="container">
      <div style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
        <h2 style="margin-bottom: 2rem;">Editar Cancha</h2>

        <form method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
          {% csrf_token %}

          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Nombre</label>
            <input type="text" name="nombre" value="{{ cancha.nombre }}" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
          </div>

          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Tipo</label>
            <select name="tipo" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
              {% for tipo_id, tipo_nombre in tipos_cancha %}
                <option value="{{ tipo_id }}" {% if cancha.tipo == tipo_id %}selected{% endif %}>{{ tipo_nombre }}</option>
              {% endfor %}
            </select>
          </div>

          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Capacidad</label>
            <input type="number" name="capacidad" value="{{ cancha.capacidad }}" min="1" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
          </div>

          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Descripción</label>
            <textarea name="descripcion" rows="4" style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">{{ cancha.descripcion }}</textarea>
          </div>

          <div>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" name="estado" {% if cancha.estado %}checked{% endif %} style="width: 18px; height: 18px; cursor: pointer;">
              <span style="font-weight: 600;">Cancha Activa</span>
            </label>
          </div>

          <!-- Tarifas: mostrar precios bloqueados y botón para editar -->
          <div>
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Tarifas</label>
            <div style="display: flex; flex-direction: column; gap: 0.8rem;">
              {% for tarifa in tarifas %}
                <div style="display:flex; gap:0.6rem; align-items:center;">
                  <div style="flex:1; font-weight:600;">{{ tarifa.get_franja_display }}</div>
                  <input type="number" name="precio_{{ tarifa.id }}" value="{{ tarifa.precio_por_hora }}" min="0" class="tarifa-price-input" disabled style="width:140px; padding:0.6rem; border:1px solid #ddd; border-radius:6px;">
                </div>
              {% empty %}
                <div>No hay tarifas configuradas para esta cancha.</div>
              {% endfor %}
            </div>
            <button type="button" id="btn-toggle-tarifas" style="margin-top:0.8rem; padding:0.6rem 0.9rem; border-radius:6px; border:none; background:linear-gradient(135deg,#1e3c72 0%,#2a7f62 100%); color:white; cursor:pointer; font-weight:600;">Editar tarifas</button>
          </div>

          <button type="submit" style="padding: 0.8rem; background: linear-gradient(135deg, #1e3c72 0%, #2a7f62 100%); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Guardar Cambios</button>
          <a href="{% url 'admin_canchas_list' %}" style="text-align: center; padding: 0.8rem; background: #f0f2f5; color: #1a1a1a; border-radius: 6px; text-decoration: none; font-weight: 600;">Cancelar</a>
        </form>
      </div>
    </div>
  </main>
  <script>
    (function(){
      const btn = document.getElementById('btn-toggle-tarifas');
      if(!btn) return;
      const inputs = Array.from(document.querySelectorAll('.tarifa-price-input'));
      let editing = false;
      btn.addEventListener('click', function(){
        editing = !editing;
        inputs.forEach(i => i.disabled = !editing);
        btn.textContent = editing ? 'Cancelar edición' : 'Editar tarifas';
        if(editing){
          inputs.forEach(i => i.focus && i.focus());
        }
      });
    })();
  </script>
</body>
</html>
